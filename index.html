<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make Your Own Bouquet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css"></head>
<body>
<audio id="music" loop src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_2d8375fb3e.mp3"></audio>
<div id="petals"></div>
<div id="app">
<aside id="panel">
 <h1>Make Your Own Bouquet 💐</h1>
 <section><h3>1 · Pick your flowers</h3>
  <div class="tabs" id="tabs"></div>
  <div class="sw" id="sw"></div>
  <div class="grid" id="grid"></div>
  <p class="muted"><span id="count">0</span>/40 · tap a stem to select, drag to arrange</p>
  <div id="tools" class="row hide"><button data-a="s-">−</button><button data-a="s+">＋</button><button data-a="r-">⟲</button><button data-a="r+">⟳</button><button data-a="f">⇅</button><button data-a="d">🗑</button></div>
 </section>
 <section><h3>2 · Wrap it</h3>
  <div class="sw" id="wsw"></div>
  <div class="row"><input type="color" id="wrapC" value="#ffd9e2"><select id="wrapP"><option value="">Smooth</option><option value="p-dots">Polka dots</option><option value="p-stripe">Stripes</option><option value="p-check">Gingham</option></select></div>
  <div class="row"><input type="color" id="ribC" value="#e0577f"><span>Ribbon</span></div>
 </section>
 <section><h3><label><input type="checkbox" id="msgOn"> 3 · Add a message 💌</label></h3>
  <div id="msgBox" class="hide">
   <input id="to" placeholder="To…" maxlength="30"><input id="from" placeholder="From…" maxlength="30">
   <textarea id="text" maxlength="500" placeholder="Write something sweet…"></textarea>
   <label class="file">📷 Add a photo<input type="file" id="photo" accept="image/*" hidden></label>
   <img id="thumb" class="hide" alt="">
   <div class="row"><input type="color" id="envC" value="#f4e3e6"><span>Envelope</span></div>
  </div>
 </section>
 <button class="primary" id="share">🔗 Create gift link</button>
 <p id="linkOut" class="muted"></p>
 <div class="row"><button id="save">📥 PNG</button><button id="dark">🌙</button><button id="musicBtn">🎵</button></div>
</aside>
<main id="stage">
 <p id="hint" class="hide">Tap the envelope 💌</p>
 <div id="frame">
  <div id="tag" class="hide"></div>
  <div id="bunch"></div>
  <div id="wrapBack"></div><div id="wrapFront"></div>
  <div id="bow"></div>
  <div id="mini" class="hide"></div>
 </div>
</main>
</div>
<div id="ov" class="hide"><div class="env" id="env"><div class="eb"></div><div class="letter"><h4 id="lTo"></h4><img id="lImg" class="hide" alt=""><p id="lText"></p><p id="lFrom"></p></div><div class="ef"></div><div class="fl"></div></div><button id="close">✕</button></div>
<script src="app.js"></script>
</body></html>
